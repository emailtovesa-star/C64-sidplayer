<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C64 SID Player V3.9.1</title>
<style>
:root{--bg:#07071c;--panel:#211d72;--ink:#d9d7ff;--cyan:#69edff;--pink:#ff70c7;--yellow:#ffe36c;--green:#8aff99}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#18145d,#07071c 48%);color:var(--ink);font-family:monospace;padding:14px;min-height:100vh}
.wrap{max-width:760px;margin:auto}h1{text-align:center;color:#fff;font-size:30px;margin:6px 0 0;text-shadow:3px 3px #4943c1}
.sub{text-align:center;color:var(--cyan);font-size:12px;margin-bottom:11px}
.panel{background:var(--panel);border:2px solid #6560dc;border-radius:14px;padding:13px;box-shadow:0 16px 40px #0008}
.screen{background:#030313;border:2px solid #4d48aa;border-radius:9px;padding:12px}
#title{color:#fff;font-weight:bold;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#author{color:var(--cyan);margin-top:5px}#release{color:var(--yellow);margin-top:4px}#track{color:var(--pink);margin-top:7px}
.engine{margin-top:8px;color:var(--green);font-weight:bold}.buffer{margin-top:5px;color:#b4ffbd;font-size:11px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
button,.load{border:2px solid #7772ec;border-radius:8px;background:#111049;color:#fff;min-height:45px;font:bold 13px monospace;padding:8px}
.load{display:flex;align-items:center;justify-content:center;margin-top:10px}input[type=file]{display:none}
.list{margin-top:10px;background:#08072c;border:1px solid #4e49ae;border-radius:8px;max-height:220px;overflow:auto}
.item{padding:9px;border-bottom:1px solid #292668}.item.current{background:#302a92}.item:last-child{border-bottom:0}
.status{margin-top:10px;background:#09082d;padding:9px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-word}
.badge{text-align:center;margin-top:8px;font-size:10px;color:#b7ffbd}
@media(max-width:520px){.controls{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap"><h1>C64 SID PLAYER</h1><div class="sub">HVSC EXACT LOOP · V3.9.1</div>
<div class="panel">
<div class="screen">
<div id="title">NO SID LOADED</div><div id="author">ADD SID FILES</div><div id="release">&nbsp;</div>
<div id="track">SUBTUNE -- / --</div><div id="duration" style="color:#8aff99;margin-top:5px">LENGTH: --:--</div>
<div class="engine" id="engine">ENGINE: STARTING reSIDfp WORKER...</div>
<div class="buffer" id="buffer">NATIVE BUFFER: 0 ms</div>
</div>
<div class="controls">
<button id="prevSong">|&lt; SONG</button><button id="prevSub">&lt; SUB</button><button id="play">PLAY</button><button id="pause">PAUSE</button>
<button id="nextSub">SUB &gt;</button><button id="nextSong">SONG &gt;|</button><button id="restart">RESTART</button><button id="stop">STOP</button>
</div>
<div class="controls">
<button id="loopOne">LOOP 1: OFF</button><button id="restartLoop">RESTART SONG</button>
</div>
<label class="load">ADD .SID FILES<input id="files" type="file" multiple accept=".sid,audio/prs.sid,audio/x-sid,application/octet-stream"></label>
<div class="list" id="list"><div class="item">No tunes loaded.</div></div>
<div class="status" id="status">Starting worker + native AudioTrack pipeline…</div>
<div class="badge">Dedicated SID worker · Native Android AudioTrack · HVSC Songlengths exact loop</div>
</div></div>

<script type="module">
let worker=null, queue=[], current=-1, activeSub=0, currentBytes=null, playing=false, pcmGeneration=1, loopOne=false;
let pickerPaused=false, wasPlayingBeforePicker=false, workerReady=false;
const $=id=>document.getElementById(id), status=s=>$("status").textContent=s;
const toBase64=(buf)=>{
  const bytes=new Uint8Array(buf); let out=""; const CHUNK=0x8000;
  for(let i=0;i<bytes.length;i+=CHUNK) out+=String.fromCharCode(...bytes.subarray(i,i+CHUNK));
  return btoa(out);
};

function android(fn,...args){
  try{
    const obj=window.AndroidPlayer;
    if(obj&&typeof obj[fn]==="function") return obj[fn](...args);
  }catch(e){}
  return null;
}
function renderList(){
  $("list").innerHTML="";
  if(!queue.length){$("list").innerHTML='<div class="item">No tunes loaded.</div>';return}
  queue.forEach((q,i)=>{
    const d=document.createElement("div");
    d.className="item "+(i===current?"current":"");
    d.textContent=q.file.name;
    d.onclick=()=>loadSong(i,true);
    $("list").appendChild(d);
  });
}
function updateTrack(){
  const q=queue[current]; if(!q||!q.header)return;
  $("track").textContent="SUBTUNE "+(activeSub+1)+" / "+Math.max(1,q.header.songs||1);
}
async function ensureBytes(q){
  if(!q.bytes)q.bytes=new Uint8Array(await q.file.arrayBuffer());
  return q.bytes;
}

function startWorker(){
  worker=new Worker("./sid-worker.js",{type:"module"});
  worker.onmessage=e=>{
    const m=e.data||{};
    if(m.type==="db"){
      status(m.entries ? "HVSC database loaded: "+m.entries+" tunes." : "HVSC database failed to load.");
    }else if(m.type==="ready"){
      workerReady=true;
      $("engine").textContent="ENGINE: "+m.engine+" · WORKER";
      status("reSIDfp worker ready. Native AudioTrack ready.");
    }else if(m.type==="loaded"){
      const q=queue[current];
      if(q)q.header=m.header;
      activeSub=m.sub||0;
      $("title").textContent=m.header.name||queue[current].file.name;
      $("author").textContent="BY "+(m.header.author||"UNKNOWN");
      $("release").textContent=m.header.release||"RELEASE INFO UNKNOWN";
      updateTrack(); renderList();
      status("Loaded with worker. Press PLAY.");
    }else if(m.type==="duration"){
      const sec=Number(m.seconds);
      if(Number.isFinite(sec)&&sec>0){
        const mm=Math.floor(sec/60), ss=Math.floor(sec%60);
        $("duration").textContent="LENGTH: "+mm+":"+String(ss).padStart(2,"0")+" · HVSC";
      }else{
        $("duration").textContent="LENGTH: UNKNOWN · HVSC";
      }
    }else if(m.type==="looped"){
      status("Looped current SID at its HVSC song length.");
    }else if(m.type==="pcm"){
      // Generation tag prevents already-posted PCM from the previous SID being heard.
      const gen = m.generation ?? pcmGeneration;
      if (gen !== pcmGeneration) return;
      const b64=toBase64(m.buffer);
      android("enqueuePcm", b64);
    }else if(m.type==="error"){
      status("ENGINE ERROR: "+m.message);
    }
  };
  worker.onerror=e=>status("WORKER ERROR: "+(e.message||"unknown"));
}
startWorker();

async function loadSong(i,autoplay=false,subOverride=null){
  if(i<0||i>=queue.length||!workerReady)return;
  pauseInternal(true);
  pcmGeneration++;
  android("resetAudioOutput");
  current=i;
  const q=queue[i], bytes=await ensureBytes(q);
  currentBytes=bytes;
  android("clearPcm");
  const copy=bytes.slice();
  worker.postMessage({type:"load",buffer:copy.buffer,song:subOverride,pcmGeneration},[copy.buffer]);
  renderList();
  if(autoplay){
    // Give the worker a moment to complete load before starting.
    setTimeout(()=>play(),120);
  }
}
function play(){
  if(current<0){if(queue.length)loadSong(0,true);return}
  if(!workerReady)return;
  android("startPlaybackService");
  playing=true;
  worker.postMessage({type:"play"});
  status("Playing through native Android AudioTrack.");
}
function pauseInternal(clearNative=false){
  if(worker)worker.postMessage({type:"pause"});
  playing=false;
  if(clearNative)android("clearPcm");
}
function pause(){pauseInternal(true);status("Paused")}
function stop(){
  pauseInternal(true);
  if(worker)worker.postMessage({type:"stop"});
  android("stopPlaybackService");
  status("Stopped");
}
async function changeSub(delta){
  const q=queue[current]; if(!q||!q.header)return;
  const max=Math.max(1,q.header.songs||1);
  const n=Math.max(0,Math.min(max-1,activeSub+delta));
  await loadSong(current,true,n);
}
function changeSong(delta){
  if(!queue.length)return;
  loadSong((current+delta+queue.length)%queue.length,true);
}

$("files").onchange=async e=>{
  for(const f of [...e.target.files]){
    if(f.name.toLowerCase().endsWith(".sid")) queue.push({file:f,bytes:null,header:null});
  }
  renderList();
  if(current<0&&queue.length)await loadSong(0,false);
  e.target.value="";
};

$("play").onclick=play;
$("pause").onclick=pause;
$("stop").onclick=stop;
$("restart").onclick=()=>current>=0&&loadSong(current,true,activeSub);
$("prevSub").onclick=()=>changeSub(-1);
$("nextSub").onclick=()=>changeSub(1);
$("prevSong").onclick=()=>changeSong(-1);
$("nextSong").onclick=()=>changeSong(1);
$("loopOne").onclick=()=>{
  loopOne=!loopOne;
  $("loopOne").textContent="LOOP 1: "+(loopOne?"ON":"OFF");
  if(worker) worker.postMessage({type:"loopOne",enabled:loopOne});
  status(loopOne?"Loop 1 ON · exact HVSC duration when available.":"Loop 1 OFF");
};
$("restartLoop").onclick=()=>{ if(current>=0) loadSong(current,true,activeSub); };

window.onNativeFilePickerOpening=()=>{
  wasPlayingBeforePicker=playing;
  if(playing){ pauseInternal(true); pickerPaused=true; status("Paused safely while adding SID files…"); }
};
window.onNativeFilePickerClosed=()=>{
  if(pickerPaused&&wasPlayingBeforePicker){
    pickerPaused=false; wasPlayingBeforePicker=false; play();
  }
};

window.onAndroidBackground=()=>{
  if(playing){
    android("startPlaybackService");
    status("Background playback active · native AudioTrack");
  }
};
window.onAndroidForeground=()=>{
  if(playing) status("Playing through native Android AudioTrack.");
};

setInterval(()=>{
  const ms=android("bufferedMs");
  if(ms!==null&&ms!==undefined)$("buffer").textContent="NATIVE BUFFER: "+ms+" ms";
},500);
</script>
</body>
</html>
