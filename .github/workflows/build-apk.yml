name: Build Android APK V3.2
on: { workflow_dispatch: {}, push: { branches: [ main, master ] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Fetch libsidplayfp WASM high-compatibility engine
        run: |
          mkdir -p app/src/main/assets/wasm
          base=https://raw.githubusercontent.com/chrisgleissner/libsidplayfp-wasm/main/dist
          curl -fL $base/index.js -o app/src/main/assets/wasm/index.js
          curl -fL $base/player.js -o app/src/main/assets/wasm/player.js
          curl -fL $base/libsidplayfp.js -o app/src/main/assets/wasm/libsidplayfp.js
          curl -fL $base/libsidplayfp.wasm -o app/src/main/assets/wasm/libsidplayfp.wasm
          curl -fL $base/LICENSE -o app/src/main/assets/wasm/LICENSE
          curl -fL $base/THIRD-PARTY-NOTICES.md -o app/src/main/assets/wasm/THIRD-PARTY-NOTICES.md
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk C64-SID-Player-V3.2.apk
      - uses: actions/upload-artifact@v4
        with: { name: C64-SID-Player-V3.2-APK, path: C64-SID-Player-V3.2.apk }
